<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512v3.png">
    <link rel="apple-touch-icon" href="/icon-512v3.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cyber-Ponk">
    <meta name="description" content="Rozliczenia kortu i frekwencja grupy — salda, ranking, historia sesji.">
    <!-- Prywatna apka grupy: imiona, salda i numer BLIK nie powinny trafić do wyszukiwarek. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Fonty są w bundlu (@fontsource, patrz main.tsx) — brak zależności od
         zewnętrznego CDN, dzięki czemu interfejs wygląda tak samo offline. -->
    <title>Cyber-Ponk — rozliczenia sesji</title>
    <!--
      Straż startu musi działać także wtedy, gdy paczki aplikacji się nie wczytają,
      więc jest ładowana synchronicznie i spoza bundla. Stały adres bez hasha
      i `no-cache` z `firebase.json` gwarantują, że zawsze jest osiągalna i świeża.
    -->
    <script src="/boot-guard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
